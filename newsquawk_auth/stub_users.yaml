# Stub authentication users.
#
# This is the bundled SAMPLE data used by StubIdentityProvider when no data
# file is supplied. Copy it, point the provider at your own copy, and edit as
# needed. For local development only — never use these credentials anywhere
# real.
#
# Passwords must be bcrypt hashes. Plaintext passwords are not supported.
#
# To generate a bcrypt password hash:
#
#   Python (with bcrypt installed):
#     import bcrypt
#     password = b"your-password-here"
#     hashed = bcrypt.hashpw(password, bcrypt.gensalt(rounds=12))
#     print(hashed.decode("ascii"))
#
#   Command line (with htpasswd from apache2-utils):
#     htpasswd -bnBC 12 "" "your-password-here" | tr -d ':\n' | sed 's/$2y/$2b/'
#
# The server verifies hashes using bcrypt.checkpw().
#
# `roles` maps a role name to the list of user ids that hold it. Each id listed
# under a role is granted that realm role (nested under realm_access.roles in
# the issued token), so has_realm_role()/has_any_realm_role() work unchanged.
